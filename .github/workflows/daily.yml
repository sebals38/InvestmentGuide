name: daily-dashboard

on:
  schedule:
    # 하루 2번 (한국 평일). GitHub 예약 실행은 보통 2~4시간 늦게 시작되므로
    # 목표 시각(10시·15시)보다 약 2시간 앞당겨 걸어 둠.
    # 22:47 UTC 일~목 = 한국 07:47 월~금 (미국 마감 반영)
    - cron: "47 22 * * 0-4"
    # 03:47 UTC 월~금 = 한국 12:47 월~금 (국내 장중 반영)
    - cron: "47 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python dashboard.py

      - name: Commit results
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs report data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "dashboard: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase -X theirs origin ${{ github.ref_name }}   # 결과 파일 충돌 시 이번 실행 결과 우선
          git push
